<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Signup Form</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <main>
    <div class="container">
      <div class="content">
        <h1>Stay updated !</h1>
        <p>Join 60,000+ product managers receiving monthly updates on:</p>
        <ul>
          <li><img src="images/icon-list.svg" alt=""> Product discovery and building what matters </li>
          <li><img src="images/icon-list.svg" alt=""> Measuring to ensure updates are a success </li>
          <li><img src="images/icon-list.svg" alt=""> And much more! </li>
        </ul>

        <form class="email-content" novalidate>
          <div class="email-header">
            <label for="email" class="email-label">Email address</label>
            <span class="error-message">Valid email required</span>
          </div>
          <input type="email" id="email" class="email-text" name="email" placeholder="email@company.com" required>
          <button type="submit" class="button-submit">Subscribe to monthly newsletter</button>
        </form>

      </div>

      <picture>
        <source media="(max-width:768px)" srcset="images/illustration-sign-up-mobile.svg">


        <img src="images/illustration-sign-up-desktop.svg" alt="">


      </picture>


    </div>

  </main>


  <script src="app.js"></script>
</body>

</html>
